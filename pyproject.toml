[tool.poetry]
name = "r-sodium-ultra-2-control-center"
version = "1.0"
description = "GUI Manager for R-SODIUM Ultra 2 Docker Station"
authors = ["Barryblueice <barryblueice@outlook.com>"]
license = "MPL-2.0"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
usb = "^0.0.83.dev0"
pyusb = "^1.3.1"
hidapi = "^0.15.0"
pystray = "^0.19.5"
pillow = "^12.0.0"
pyside6 = "^6.10.1"
libusb = "^1.0.29.post1"
libusb1 = "^3.3.1"


[[tool.poetry.source]]
name = "mirrors"
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple/"
priority = "primary"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
